# Categories for auto-generated release notes (use PR labels).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: "🚀 Features"
      labels: [feature, enhancement]
    - title: "🐛 Fixes"
      labels: [bug, fix]
    - title: "🧠 AI / Models"
      labels: [ai, model]
    - title: "🔧 Maintenance"
      labels: [chore, ci, dependencies]
    - title: "Other changes"
      labels: ["*"]
